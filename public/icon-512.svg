<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="restograd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="#0f172a" />
  <rect x="24" y="24" width="464" height="464" rx="92" fill="url(#restograd)" fill-opacity="0.12" stroke="#4f46e5" stroke-width="4" />
  <!-- Robot + Chef + WhatsApp Core Symbol -->
  <g transform="translate(256, 230) scale(1.3)" filter="url(#glow)">
    <!-- Bot Head -->
    <rect x="-70" y="-60" width="140" height="110" rx="32" fill="#1e293b" stroke="#818cf8" stroke-width="6" />
    <!-- Bot Ears/Antennas -->
    <circle cx="-74" cy="-5" r="10" fill="#6366f1" />
    <circle cx="74" cy="-5" r="10" fill="#6366f1" />
    <line x1="0" y1="-60" x2="0" y2="-85" stroke="#818cf8" stroke-width="6" stroke-linecap="round" />
    <circle cx="0" cy="-92" r="14" fill="#10b981" />
    
    <!-- Eyes with Digital Glow -->
    <circle cx="-32" cy="-15" r="16" fill="#10b981" />
    <circle cx="32" cy="-15" r="16" fill="#10b981" />
    <circle cx="-30" cy="-17" r="5" fill="#ffffff" />
    <circle cx="34" cy="-17" r="5" fill="#ffffff" />
    
    <!-- Smile / Audio waves -->
    <path d="M -28 20 Q 0 38 28 20" stroke="#818cf8" stroke-width="5" fill="none" stroke-linecap="round" />
  </g>
  <!-- Brand text badge -->
  <rect x="96" y="380" width="320" height="64" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <text x="256" y="422" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    NÓMADA <tspan fill="#10b981">BOTS</tspan>
  </text>
</svg>
